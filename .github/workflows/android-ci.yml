name: Android CI (APK Build + Release)

on:
  push:
    paths:
      - "app/src/**"
      - "app/build.gradle"
      - "**/*.kt"
      - "**/*.xml"
      - "version.properties"
      - ".github/workflows/android-ci.yml"
    branches:
      - "**"

permissions:
  contents: write
  packages: write

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}

      # -----------------------------
      # Auto Version Bump
      # -----------------------------
      - name: Bump version
        run: |
          PROPS_FILE=version.properties
          VERSION_CODE=$(grep VERSION_CODE $PROPS_FILE | cut -d'=' -f2)
          VERSION_NAME=$(grep VERSION_NAME $PROPS_FILE | cut -d'=' -f2)
          
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_MAJOR=$(echo $VERSION_NAME | cut -d'.' -f1)
          VERSION_MINOR=$(echo $VERSION_NAME | cut -d'.' -f2)
          NEW_VERSION_MINOR=$((VERSION_MINOR + 1))
          NEW_VERSION_NAME="$VERSION_MAJOR.$NEW_VERSION_MINOR"
          
          sed -i "s/VERSION_CODE=.*/VERSION_CODE=$NEW_VERSION_CODE/" $PROPS_FILE
          sed -i "s/VERSION_NAME=.*/VERSION_NAME=$NEW_VERSION_NAME/" $PROPS_FILE
          
          git config user.name github-actions
          git config user.email actions@github.com
          git add $PROPS_FILE
          git commit -m "CI: bump to $NEW_VERSION_NAME ($NEW_VERSION_CODE)" || echo "no commit"
          git push origin HEAD:${GITHUB_REF}

          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV

      # Restore Signing + Firebase files
      - name: Restore debug.keystore
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > $HOME/.android/debug.keystore

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          mkdir -p app/src/shopowner
          cp app/google-services.json app/src/shopowner/google-services.json

      # Build APKs
      - name: Build Shopowner APK
        run: ./gradlew assembleShopownerDebug

      - name: Build Customer APK
        run: ./gradlew assembleCustomerDebug

      # Release APKs
      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION_NAME }}
          name: Release v${{ env.NEW_VERSION_NAME }}
          files: |
            app/build/outputs/apk/shopowner/debug/app-shopowner-debug.apk
            app/build/outputs/apk/customer/debug/app-customer-debug.apk
