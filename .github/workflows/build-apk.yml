name: Android CI

on:
  push:
    branches:
      - '**'   # any branch

permissions:
  contents: write   # allow push to repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bump version
        run: |
          PROPS_FILE=version.properties
          VERSION_CODE=$(grep VERSION_CODE $PROPS_FILE | cut -d'=' -f2)
          VERSION_NAME=$(grep VERSION_NAME $PROPS_FILE | cut -d'=' -f2)
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_MAJOR=$(echo $VERSION_NAME | cut -d'.' -f1)
          VERSION_MINOR=$(echo $VERSION_NAME | cut -d'.' -f2)
          NEW_VERSION_MINOR=$((VERSION_MINOR + 1))
          NEW_VERSION_NAME="$VERSION_MAJOR.$NEW_VERSION_MINOR"
          sed -i "s/VERSION_CODE=$VERSION_CODE/VERSION_CODE=$NEW_VERSION_CODE/" $PROPS_FILE
          sed -i "s/VERSION_NAME=$VERSION_NAME/VERSION_NAME=$NEW_VERSION_NAME/" $PROPS_FILE
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add $PROPS_FILE
          git commit -m "CI: bump to $NEW_VERSION_NAME ($NEW_VERSION_CODE)" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF}
          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      - name: Restore debug.keystore
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > $HOME/.android/debug.keystore

      - name: Restore google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          mkdir -p app/src/shopowner
          cp app/google-services.json app/src/shopowner/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Set backend secrets
        run: echo "Backend secrets set"
        env:
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: Build Shopowner APK
        run: ./gradlew assembleShopownerDebug
        env:
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: Build Customer APK
        run: ./gradlew assembleCustomerDebug
        env:
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION_NAME }}
          name: Release v${{ env.NEW_VERSION_NAME }}
          files: |
            app/build/outputs/apk/shopowner/debug/app-shopowner-debug.apk
            app/build/outputs/apk/customer/debug/app-customer-debug.apk


      # -----------------------------
      # Docker build & push backend
      # -----------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/backend:${{ env.NEW_VERSION_NAME }}
          docker build -t $IMAGE_NAME app/backend
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push backend Docker image
        run: |
          docker push $IMAGE_NAME
          docker tag $IMAGE_NAME ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/backend:latest
