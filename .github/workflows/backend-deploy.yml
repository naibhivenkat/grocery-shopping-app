name: Backend Deploy (Cloud Run – Artifact Registry)

on:
  push:
    branches:
      - "**"
    paths:
      - "app/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  REPOSITORY: backend-images
  IMAGE_NAME: backend
  SERVICE_NAME: grocery-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 4️⃣ Docker auth
      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      # 5️⃣ Generate TAG (same as local)
      - name: Generate build tag
        run: |
          TAG=$(date +%s)
          echo "TAG=$TAG" >> $GITHUB_ENV

      # 6️⃣ Build & Push (timestamp + latest)
      - name: Build & Push image
        run: |
          gcloud builds submit app/backend \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$TAG \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # 7️⃣ Deploy (same as local)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars=FLASK_ENV=production,JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest


      - name: Cleanup old images (keep last 2, protect latest)
        run: |
          echo "🧹 Cleaning old images, keeping latest 2..."

          gcloud artifacts versions list \
            --location=${{ env.REGION }} \
            --repository=${{ env.REPOSITORY }} \
            --package=${{ env.IMAGE_NAME }} \
            --sort-by=~createTime \
            --format="value(name,tags)" \
          | tail -n +3 \
          | while read version tags; do
              if [[ "$tags" == *"latest"* ]]; then
                echo "Skipping latest-tagged image: $version"
                continue
              fi

              echo "Deleting $version"
              gcloud artifacts versions delete "$version" \
                --package=${{ env.IMAGE_NAME }} \
                --repository=${{ env.REPOSITORY }} \
                --location=${{ env.REGION }} \
                --quiet || true
            done
      
      
