name: Backend Deploy (Cloud Run – Artifact Registry)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "app/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  REPOSITORY: backend-images
  IMAGE_NAME: backend
  SERVICE_NAME: grocery-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for backend validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate backend before deployment
        working-directory: app/backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m compileall -q main.py auth_utils.py routes tests

      # 2️⃣ Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Keep sensitive runtime values in GitHub Actions Secrets. This step
      # mirrors the five backend secrets into Secret Manager so the deploy
      # command below can continue using Cloud Run secret references.
      - name: Sync backend secrets to Secret Manager
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          RAZORPAY_KEY_ID_VALUE: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET_VALUE: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET_VALUE: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          WEBHOOK_SECRET_VALUE: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          declare -A SECRET_VALUES=(
            [JWT_SECRET]="$JWT_SECRET_VALUE"
            [RAZORPAY_KEY_ID]="$RAZORPAY_KEY_ID_VALUE"
            [RAZORPAY_KEY_SECRET]="$RAZORPAY_KEY_SECRET_VALUE"
            [RAZORPAY_WEBHOOK_SECRET]="$RAZORPAY_WEBHOOK_SECRET_VALUE"
            [WEBHOOK_SECRET]="$WEBHOOK_SECRET_VALUE"
          )

          for NAME in "${!SECRET_VALUES[@]}"; do
            VALUE="${SECRET_VALUES[$NAME]}"
            if [[ -z "$VALUE" ]]; then
              echo "::error::GitHub Actions secret $NAME is not configured"
              exit 1
            fi

            if ! gcloud secrets describe "$NAME" --project="$PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$NAME" \
                --replication-policy=automatic \
                --project="$PROJECT_ID"
            fi

            printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" \
              --data-file=- \
              --project="$PROJECT_ID"
          done

      # 4️⃣ Docker auth
      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      # 5️⃣ Install jq
      - name: Install jq
        run: sudo apt-get install jq -y

      - name: Build immutable backend image
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          gcloud builds submit app/backend --tag "$IMAGE_BASE:${GITHUB_SHA}"

      # 8️⃣ Deploy Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --update-env-vars=FLASK_ENV=production,ENABLE_LEGACY_ROUTES=0,FIREBASE_STORAGE_BUCKET=groceryapp-fe2ec.firebasestorage.app,BACKEND_RELEASE=${{ github.sha }} \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest,JWT_SECRET=JWT_SECRET:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest

      # 9️⃣ Wait for Cloud Run to stabilize
      - name: Wait for deployment
        run: sleep 45

      # Cloud Run can accept a deployment while the revision is failing its
      # startup probe. Verify the public health route so a broken revision
      # fails CI instead of silently serving 503s to the mobile app.
      - name: Verify deployed health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$SERVICE_URL/health"
          python app/backend/scripts/verify_deployed.py --base-url "$SERVICE_URL" --phase release

        # 🔟 Get currently deployed digest (IMPORTANT)
      - name: Get deployed digest
        run: |
          DEPLOYED_IMAGE=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --format='value(status.latestReadyRevisionName)')

          DEPLOYED_DIGEST=$(gcloud run revisions describe $DEPLOYED_IMAGE \
          --region=${{ env.REGION }} \
          --format='value(status.imageDigest)')

          echo "DEPLOYED_DIGEST=$DEPLOYED_DIGEST" >> $GITHUB_ENV
          echo "Deployed digest protected: $DEPLOYED_DIGEST"


      # Retain revision images for rollback; cleanup is a separate operation.
