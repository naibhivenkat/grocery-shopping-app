name: Backend Deploy (Cloud Run)

on:
  push:
    paths:
      - "app/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Google Auth
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Docker auth
        run: gcloud auth configure-docker gcr.io --quiet

      # Optional IAM diagnostics
      - name: Check IAM
        run: |
          echo "$GCP_SA_KEY_JSON" > sa.json
          SA_EMAIL=$(jq -r '.client_email' sa.json)
          gcloud projects get-iam-policy "${{ secrets.GCP_PROJECT_ID }}" \
            --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:$SA_EMAIL" \
            --format="table(bindings.role)"
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Build via Cloud Build
        run: |
          IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${GITHUB_SHA}
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          gcloud builds submit app/backend --tag $IMAGE_NAME

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_SERVICE_NAME }} \
            --image $IMAGE_NAME \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
             --set-env-vars FLASK_ENV=production,SECRET_KEY="super-secret-key-change-this" \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest
