name: Android CI + Backend Deploy

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout source
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Setup JDK
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # -----------------------------
      # Gradle cache
      # -----------------------------
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # -----------------------------
      # Auto version bump
      # -----------------------------
      - name: Bump version
        run: |
          PROPS_FILE=version.properties
          VERSION_CODE=$(grep VERSION_CODE $PROPS_FILE | cut -d'=' -f2)
          VERSION_NAME=$(grep VERSION_NAME $PROPS_FILE | cut -d'=' -f2)
          
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_MAJOR=$(echo $VERSION_NAME | cut -d'.' -f1)
          VERSION_MINOR=$(echo $VERSION_NAME | cut -d'.' -f2)
          NEW_VERSION_MINOR=$((VERSION_MINOR + 1))
          NEW_VERSION_NAME="$VERSION_MAJOR.$NEW_VERSION_MINOR"
          
          sed -i "s/VERSION_CODE=$VERSION_CODE/VERSION_CODE=$NEW_VERSION_CODE/" $PROPS_FILE
          sed -i "s/VERSION_NAME=$VERSION_NAME/VERSION_NAME=$NEW_VERSION_NAME/" $PROPS_FILE
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add $PROPS_FILE
          git commit -m "CI: bump to $NEW_VERSION_NAME ($NEW_VERSION_CODE)" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF}
          
          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      # -----------------------------
      # Restore keys
      # -----------------------------
      - name: Restore debug.keystore
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > $HOME/.android/debug.keystore

      - name: Restore google-services.json
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          mkdir -p app/src/shopowner
          cp app/google-services.json app/src/shopowner/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # -----------------------------
      # Build Android
      # -----------------------------
#      - name: Build Shopowner APK
#        run: ./gradlew assembleShopownerDebug
#        env:
#          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
#          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
#
#      - name: Build Customer APK
#        run: ./gradlew assembleCustomerDebug
#        env:
#          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
#          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
#
#      # -----------------------------
#      # Release APKs
#      # -----------------------------
#      - name: Upload APKs to Release
#        uses: softprops/action-gh-release@v1
#        with:
#          tag_name: v${{ env.NEW_VERSION_NAME }}
#          name: Release v${{ env.NEW_VERSION_NAME }}
#          files: |
#            app/build/outputs/apk/shopowner/debug/app-shopowner-debug.apk
#            app/build/outputs/apk/customer/debug/app-customer-debug.apk

      # ==========================================================
      # BACKEND DEPLOYMENT TO GOOGLE CLOUD RUN
      # ==========================================================

      # -----------------------------
      # Authenticate to Google Cloud
      # -----------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # ==========================================================
      # IAM VALIDATION (NEW - Prevents _cloudbuild errors)
      # ==========================================================
      - name: Check IAM Roles
        run: |
          echo "$GCP_SA_KEY" > sa.json
          SA_EMAIL=$(jq -r '.client_email' sa.json)

          echo "Using service account: $SA_EMAIL"

          gcloud projects get-iam-policy "${{ secrets.GCP_PROJECT_ID }}" \
            --flatten="bindings[].members" \
            --filter="bindings.members:serviceAccount:$SA_EMAIL" \
            --format="table(bindings.role)"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}


      # ==========================================================
      # CLOUD BUILD (appears in Cloud Run build history)
      # ==========================================================
      - name: Build backend with Cloud Build
        run: |
          IMAGE_NAME=gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ env.NEW_VERSION_NAME }}
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          
          gcloud builds submit app/backend \
            --tag $IMAGE_NAME

      # -----------------------------
      # Deploy to Cloud Run
      # -----------------------------
      - name: Deploy backend to Cloud Run
        run: |
          echo "🚀 Deploying $IMAGE_NAME to Cloud Run..."
          gcloud run deploy ${{ secrets.GCP_SERVICE_NAME }} \
            --image $IMAGE_NAME \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars FLASK_ENV=production,SECRET_KEY="super-secret-key-change-this" \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest
