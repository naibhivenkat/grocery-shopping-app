name: Backend Deploy (Cloud Run – Artifact Registry)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "app/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  REPOSITORY: backend-images
  IMAGE_NAME: backend
  SERVICE_NAME: grocery-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 4️⃣ Docker auth
      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      # 5️⃣ Install jq
      - name: Install jq
        run: sudo apt-get install jq -y

      # 6️⃣ Detect tag vs branch
      - name: Detect release tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IS_TAG=true" >> $GITHUB_ENV
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      # 7️⃣ Build & Push
      - name: Build & Push image
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

          if [ "$IS_TAG" = "true" ]; then
          echo "Building RELEASE image: $VERSION_TAG"
          gcloud builds submit app/backend \
           --tag "$IMAGE_BASE:latest" \
           --tag "$IMAGE_BASE:$VERSION_TAG"
          else
          echo "Building branch image"
          gcloud builds submit app/backend \
           --tag "$IMAGE_BASE:latest"
          fi

      # 8️⃣ Deploy Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars=FLASK_ENV=production,JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest

      # 9️⃣ Wait for Cloud Run to stabilize
      - name: Wait for deployment
        run: sleep 45

        # 🔟 Get currently deployed digest (IMPORTANT)
      - name: Get deployed digest
        run: |
          DEPLOYED_IMAGE=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --format='value(status.latestReadyRevisionName)')
          
          DEPLOYED_DIGEST=$(gcloud run revisions describe $DEPLOYED_IMAGE \
          --region=${{ env.REGION }} \
          --format='value(status.imageDigest)')
          
          echo "DEPLOYED_DIGEST=$DEPLOYED_DIGEST" >> $GITHUB_ENV
          echo "Deployed digest protected: $DEPLOYED_DIGEST"

      - name: Cleanup docker images (tags + branch builds)
        run: |
          echo "🧹 Artifact cleanup started..."
          
          REGION="${{ env.REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          REPO="${{ env.REPOSITORY }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          
          IMAGE_PATH="$REGION-docker.pkg.dev/$PROJECT/$REPO/$IMAGE"
          
          ########################################
          # STEP 1 — CLEAN OLD VERSION TAGS
          ########################################
          
          TAGS=$(gcloud artifacts docker tags list "$IMAGE_PATH" --format="value(tag)")
          
          echo "All tags:"
          echo "$TAGS"
          
          NEWEST_V=$(echo "$TAGS" | grep '^v' | sort -Vr | head -n1)
          
          echo " ✅ Keep latest + $NEWEST_V"
          
          for TAG in $TAGS; do
          
          if [[ "$TAG" == "latest" ]]; then continue; fi
          if [[ "$TAG" == "$NEWEST_V" ]]; then continue; fi
          
          echo "Deleting old tag: $TAG"
          
          gcloud artifacts docker images delete \
          "$IMAGE_PATH:$TAG" \
          --quiet --delete-tags
          
          done
          
          ########################################
          # STEP 2 — DELETE UNTAGGED BRANCH DIGESTS
          ########################################
          
          echo "Finding untagged branch images..."
          
          gcloud artifacts versions list \
          --package="$IMAGE" \
          --repository="$REPO" \
          --location="$REGION" \
          --format=json > versions.json
          
          for VERSION in $(jq -r '.[] | select(.tags==null) | .name' versions.json); do
        
          # skip deployed digest
          if [[ "$VERSION" == *"${DEPLOYED_DIGEST##*@}"* ]]; then
          echo "Skipping deployed digest"
          continue
          fi
        
          echo "Deleting untagged version: $VERSION"
        
          gcloud artifacts versions delete "$VERSION" \
          --repository="$REPO" \
          --location="$REGION" \
          --quiet || true
          
          done
  
          echo "✅✅ Cleanup finished ✅✅"
          

