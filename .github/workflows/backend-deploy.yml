      - name: Cleanup registry (delete old tags + versions)
        run: |
          echo "🧹 Cleanup starting..."

          REGION="${{ env.REGION }}"
          REPO="${{ env.REPOSITORY }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"

          VERSIONS=$(gcloud artifacts versions list \
            --location=$REGION \
            --repository=$REPO \
            --package=$IMAGE \
            --format=json)

          # Get latest tag digest
          LATEST_DIGEST=$(echo "$VERSIONS" \
            | jq -r '.[] | select(.tags!=null and (.tags[]=="latest")) | .name')

          # Get newest release tag
          LATEST_VERSION_TAG=$(echo "$VERSIONS" \
            | jq -r '.[] | .tags[]?' \
            | grep '^v' \
            | sort -Vr \
            | head -n 1)

          VERSION_DIGEST=$(echo "$VERSIONS" \
            | jq -r --arg TAG "$LATEST_VERSION_TAG" \
              '.[] | select(.tags!=null and (.tags[]==$TAG)) | .name')

          echo "Protect latest: $LATEST_DIGEST"
          echo "Protect release: $VERSION_DIGEST"

          mapfile -t ALL_VERSIONS < <(echo "$VERSIONS" | jq -r '.[].name')

          for version in "${ALL_VERSIONS[@]}"; do

            if [[ "$version" == "$LATEST_DIGEST" ]]; then
              continue
            fi

            if [[ "$version" == "$VERSION_DIGEST" ]]; then
              continue
            fi

            echo "Removing tags from $version"

            # remove all tags attached
            TAGS=$(echo "$VERSIONS" \
              | jq -r --arg V "$version" '.[] | select(.name==$V) | .tags[]?')

            for tag in $TAGS; do
              echo "Deleting tag: $tag"
              gcloud artifacts tags delete "$tag" \
                --location=$REGION \
                --repository=$REPO \
                --quiet || true
            done

            echo "Deleting version: $version"

            gcloud artifacts versions delete "$version" \
              --location=$REGION \
              --repository=$REPO \
              --quiet || true
          done
