name: Backend Deploy (Cloud Run – Artifact Registry)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "app/backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  REPOSITORY: backend-images
  IMAGE_NAME: backend
  SERVICE_NAME: grocery-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 4️⃣ Docker auth
      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      # 5️⃣ Install jq (needed for cleanup)
      - name: Install jq
        run: sudo apt-get install jq -y

      # 6️⃣ Detect tag vs branch build
      - name: Detect release tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IS_TAG=true" >> $GITHUB_ENV
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
          fi

      # 7️⃣ Build & Push image
      - name: Build & Push image
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

          if [ "$IS_TAG" = "true" ]; then
            echo "Building RELEASE image: $VERSION_TAG"
            gcloud builds submit app/backend \
              --tag "$IMAGE_BASE:latest" \
              --tag "$IMAGE_BASE:$VERSION_TAG"
          else
            echo "Building branch image"
            gcloud builds submit app/backend \
              --tag "$IMAGE_BASE:latest"
          fi

      # 8️⃣ Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --set-env-vars=FLASK_ENV=production,JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --update-secrets=FIREBASE_CREDENTIALS_JSON=FIREBASE_CREDENTIALS_JSON:latest,SENDINBLUE_API_KEY=SENDINBLUE_API_KEY:latest,FROM_EMAIL=FROM_EMAIL:latest


      # 8 Delay for cleaning
      - name: Wait for deployment
        run: sleep 45

      # 9️⃣ Cleanup registry → KEEP ONLY latest + newest v*
      - name: Cleanup registry (keep latest + latest release only)
        run: |
          echo "🧹 Smart cleanup started..."
          
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          
          # Fetch all images JSON
          IMAGES=$(gcloud artifacts docker images list "$IMAGE_PATH" \
            --include-tags \
            --format=json)
          
          # Latest branch build (latest tag)
          LATEST_DIGEST=$(echo "$IMAGES" \
            | jq -r '.[] | select(.tags!=null and (.tags[]=="latest")) | .digest')
          
          echo "Protect latest branch build: $LATEST_DIGEST"
          
          # Latest release tag (v*)
          LATEST_VERSION_TAG=$(echo "$IMAGES" \
            | jq -r '.[] | .tags[]?' \
            | grep '^v' \
            | sort -Vr \
            | head -n 1)
          
          echo "Newest release tag: $LATEST_VERSION_TAG"
          
          # Get digest for that tag
          VERSION_DIGEST=$(echo "$IMAGES" \
            | jq -r --arg TAG "$LATEST_VERSION_TAG" \
              '.[] | select(.tags!=null and (.tags[]==$TAG)) | .digest')
          
          echo "Protect release digest: $VERSION_DIGEST"
          
          # Extract all digests safely
          mapfile -t DIGESTS < <(echo "$IMAGES" | jq -r '.[].digest')
          
          for digest in "${DIGESTS[@]}"; do
          
            if [[ "$digest" == "$LATEST_DIGEST" ]]; then
              echo "Keeping latest build"
              continue
            fi
          
            if [[ "$digest" == "$VERSION_DIGEST" ]]; then
              echo "Keeping latest release"
              continue
            fi
          
            echo "Deleting old image: $digest"
            gcloud artifacts docker images delete "$IMAGE_PATH@$digest" \
              --delete-tags --quiet || true
          done
     